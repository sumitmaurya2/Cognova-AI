<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>CognovaAI – AI Meeting Transcription & Summarization</title>

    <meta
      name="description"
      content="CognovaAI is an AI-powered meeting transcription and summarization platform that converts meeting audio into accurate transcripts, concise summaries, key insights, and actionable takeaways."
    />

    <meta
      name="keywords"
      content="AI meeting transcription, AI meeting summarizer, meeting transcription, meeting summary, audio transcription, AI meeting assistant, meeting insights, automated meeting notes, CognovaAI"
    />

    <meta name="author" content="CognovaAI" />

    <!-- Search Engine -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="CognovaAI – AI Meeting Transcription & Summarization"
    />
    <meta
      property="og:description"
      content="Transform meeting audio into accurate transcripts, concise summaries, key insights, and actionable takeaways with CognovaAI."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:site_name" content="CognovaAI" />
    <meta property="og:image" content="https://your-domain.com/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="CognovaAI – AI Meeting Transcription & Summarization"
    />
    <meta
      name="twitter:description"
      content="AI-powered meeting transcription, summaries, insights, and actionable takeaways."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#0f172a" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
